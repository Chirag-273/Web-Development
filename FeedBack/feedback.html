<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Chirag G.T.
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About Me
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="feedback.html">
                            Feedback
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="photos.html">
                            Photos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Feedback Form -->

    <div class="container mt-5 pt-5">

        <h1 class="text-center mb-4">
            Feedback Form
        </h1>

        <form class="shadow p-4 rounded bg-light">

            <div class="mb-3">
                <label for="fullname" class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    minlength="3"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Rating
                </label>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           id="verysatisfied"
                           name="rating"
                           value="Very Satisfied"
                           required>

                    <label class="form-check-label" for="verysatisfied">
                        Very Satisfied
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           id="satisfied"
                           name="rating"
                           value="Satisfied">

                    <label class="form-check-label" for="satisfied">
                        Satisfied
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           id="neutral"
                           name="rating"
                           value="Neutral">

                    <label class="form-check-label" for="neutral">
                        Neutral
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           id="unsatisfied"
                           name="rating"
                           value="Unsatisfied">

                    <label class="form-check-label" for="unsatisfied">
                        Unsatisfied
                    </label>
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Interests
                </label>

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="webdev"
                           value="Web Development">

                    <label class="form-check-label" for="webdev">
                        Web Development
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="mobiledev"
                           value="Mobile Development">

                    <label class="form-check-label" for="mobiledev">
                        Mobile Development
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="ai"
                           value="AI & Machine Learning">

                    <label class="form-check-label" for="ai">
                        AI & Machine Learning
                    </label>
                </div>

            </div>

            <div class="mb-3">

                <label for="country" class="form-label">
                    Select Country
                </label>

                <select class="form-select" id="country" required>

                    <option value="">
                        --Choose a Country--
                    </option>

                    <option>Nepal</option>
                    <option>India</option>
                    <option>USA</option>

                </select>

            </div>

            <div class="mb-3">

                <label for="feedback" class="form-label">
                    Write Your Feedback
                </label>

                <textarea
                    class="form-control"
                    id="feedback"
                    rows="5"
                    placeholder="Enter your feedback"
                    minlength="10"
                    maxlength="300"
                    required></textarea>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
